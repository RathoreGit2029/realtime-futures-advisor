version: '3.8'

services:
  advisor-db:
    image: postgres:16-alpine
    container_name: realtime_advisor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_local_pass
      POSTGRES_DB: realtime_advisor
    ports:
      - "5435:5432"
    volumes:
      - advisor_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d realtime_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  realtime-advisor-backend:
    build:
      context: ./realtime-advisor-backend
      dockerfile: Dockerfile
    container_name: realtime_advisor_api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://advisor:advisor_local_pass@advisor-db:5432/realtime_advisor
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - ./realtime-advisor-backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      advisor-db:
        condition: service_healthy

volumes:
  advisor_pgdata:
